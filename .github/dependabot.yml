# Dependabot: weekly npm updates with minor and patch releases grouped into one pull request
# (majors stay separate so they are reviewed on their own), monthly checks for the pinned
# GitHub Actions. Structure is linted by scripts/validate-yaml.mjs.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"

# Verify: typecheck, tests, build, dependency audit and the repository gates
# (invariants, design tokens, bundle budget, .github YAML policy) on both supported Node release lines.
# Actions are pinned to commit SHAs; the token is read-only; a newer run on the same
# ref cancels the older one. Structure is linted by scripts/validate-yaml.mjs.
name: Verify application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run check:invariants
      - run: npm run check:tokens
      - run: npm run check:bundle
      - run: npm run check:yaml
